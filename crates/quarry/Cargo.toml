[package]
name = "quarry"
description = "GPUI app: views, panels, viewport element, input, timeline."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
quarry-core = { path = "../quarry-core" }
quarry-ops = { path = "../quarry-ops" }
quarry-render = { path = "../quarry-render" }
quarry-io = { path = "../quarry-io" }
quarry-server = { path = "../quarry-server" }
wgpu.workspace = true
glam.workspace = true
tracing.workspace = true
pollster.workspace = true
image = { workspace = true }
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSEvent",
    "NSApplication",
    "NSResponder",
    "NSGraphicsContext",
    "block2",
] }
objc2-foundation = { workspace = true, features = ["NSProcessInfo"] }
block2.workspace = true
objc2-core-video = { workspace = true, features = [
    "CVPixelBuffer",
    "CVPixelBufferIOSurface",
    "objc2-io-surface",
] }
objc2-io-surface = { workspace = true, features = ["IOSurfaceRef"] }
objc2-metal = { workspace = true, features = [
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
