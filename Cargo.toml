[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/safi/quarry"

[workspace.dependencies]
# Stack pins from build spec §2. Exact pins: upgrade only on purpose, in its own commit.
glam = "=0.34.1"
wgpu = "=30.0.1"
transform-gizmo = "=0.11.0"
schemars = "=1.2.3"
interprocess = "=2.4.7"
rmcp = "=3.7.0"
notify = "=8.2.1"
notify-debouncer-full = "=0.7.0"
gltf = "=1.4.1"
gltf-json = "=1.4.1"
zip = "=9.1.2"
psd = "=0.3.5"
image = "=0.25.10"
directories = "=6.0.0"
gpui-kit = "=0.8.0"
cargo-packager = "=0.11.8"
octotablet = "=0.1.0"
objc2 = "=0.6.5"
egui = "=0.37.0" # fallback only, if M0 misses its numbers

# Not pinned by the spec; licence-checked like everything else.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
