name: Release

# Push a tag like v1.0.0 to build unsigned installers for every platform and
# attach them to a GitHub release.
#
# Third-party actions are pinned to commit SHAs (tag in the comment) so a
# moved tag cannot change what runs. Builds run read-only and without a cache;
# only the publish job can write, and it only uploads what the builds made.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            formats: app,dmg
          - os: macos-13        # Intel
            formats: app,dmg
          - os: windows-latest
            formats: nsis
          - os: ubuntu-22.04
            formats: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-27
        with:
          toolchain: "1.97.1"
      - name: Linux libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libvulkan-dev libfuse2
      - run: cargo install cargo-packager --version 0.11.8 --locked
      - run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/packages/*.dmg
            target/packages/*.exe
            target/packages/*.AppImage
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: installers/*
